# tmpfiles.d config for TitanShare Daemon
# This creates the required directories on install and every boot.
# Install to: /usr/lib/tmpfiles.d/titanshare.conf
#
# Type  Path                                    Mode  User  Group  Age  Argument
d       /var/lib/titanshare                     0755  -     -      -    -
d       /var/lib/titanshare/received_files      0755  -     -      -    -
